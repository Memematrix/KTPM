name: FastAPI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t cinema-api:ci .

  publish:
    name: Publish image and create release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: publish-main
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Prepare image name and version
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GH_USER" --password-stdin

      - name: Build and push release image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping creation."
          else
            printf 'Docker image: `%s:%s`\n\nPull command:\n```bash\ndocker pull %s:%s\n```\n' \
              "$IMAGE" "$VERSION" "$IMAGE" "$VERSION" > release-notes.md
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION - Cinema Booking API" \
              --notes-file release-notes.md \
              --generate-notes
          fi
